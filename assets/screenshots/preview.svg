<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
<title id="title">dothoard backup preview</title><desc id="desc">A sanitized dothoard backup preview showing planned managed changes and warnings.</desc><rect width="1200" height="640" fill="#111827"/><rect x="28" y="24" width="1144" height="592" rx="10" fill="#0b1220" stroke="#4b5563"/>
<text x="60" y="68" fill="#e5e7eb" font-family="monospace" font-size="25" font-weight="bold">dothoard  •  Backup Preview  •  Previewing</text><text x="60" y="108" fill="#a5f3fc" font-family="monospace" font-size="19">Dashboard   Repository   Sources   Ignore   ▶ Preview   Automation   History</text>
<rect x="60" y="140" width="1080" height="72" rx="6" fill="#111827" stroke="#64748b"/><text x="84" y="184" fill="#a5f3fc" font-family="monospace" font-size="19">+2 ~1 -0 ○3 ⚠1  (3 total operations)</text>
<rect x="60" y="238" width="700" height="264" rx="6" fill="#111827" stroke="#22d3ee"/><text x="84" y="278" fill="#a5f3fc" font-family="monospace" font-size="20" font-weight="bold">Managed changes</text><text x="84" y="322" fill="#86efac" font-family="monospace" font-size="18">+ desktop/home/.config/fish/config.fish</text><text x="84" y="358" fill="#fde68a" font-family="monospace" font-size="18">~ desktop/home/.gitconfig</text><text x="84" y="394" fill="#86efac" font-family="monospace" font-size="18">+ desktop/.dothoard-manifest.toml</text>
<rect x="790" y="238" width="350" height="264" rx="6" fill="#111827" stroke="#fbbf24"/><text x="814" y="278" fill="#fde68a" font-family="monospace" font-size="20" font-weight="bold">Warnings</text><text x="814" y="322" fill="#d1d5db" font-family="monospace" font-size="17">Review likely secret:</text><text x="814" y="354" fill="#d1d5db" font-family="monospace" font-size="17">.config/app/token</text><text x="814" y="410" fill="#9ca3af" font-family="monospace" font-size="16">Ignored paths never enter</text><text x="814" y="436" fill="#9ca3af" font-family="monospace" font-size="16">the Git worktree.</text>
<text x="60" y="570" fill="#94a3b8" font-family="monospace" font-size="17">b: run backup  •  r: refresh preview  •  ↑↓/jk: inspect  •  Tab: tab bar</text>
</svg>
